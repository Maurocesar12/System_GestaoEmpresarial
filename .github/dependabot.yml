version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Agrupar reduz o ruído: uma PR por família em vez de uma por pacote.
      nestjs:
        patterns: ['@nestjs/*']
      next:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next']
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
