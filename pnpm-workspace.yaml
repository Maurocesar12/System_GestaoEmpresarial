packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 exige aprovação explícita de scripts de build (postinstall).
# argon2 compila binário nativo — é obrigatório. msgpackr-extract é só
# otimização opcional do BullMQ; msgpackr funciona em JS puro sem ele.
allowBuilds:
  argon2: true
  msgpackr-extract: false
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@prisma/engines': true
  prisma: true

# Versões mínimas de dependências indiretas com vulnerabilidade conhecida
# (pnpm audit, 2026-10-02). Nenhuma é usada diretamente pelo código: vêm do
# Express/NestJS (qs, multer) e do CLI do Prisma (deepmerge-ts, fast-uri,
# mysql2). Remova uma linha quando o pacote que a puxa já trouxer a versão
# corrigida — `pnpm audit --prod` diz quando.
overrides:
  deepmerge-ts: '>=8.0.0'
  fast-uri: '>=3.1.8'
  multer: '>=2.4.0'
  mysql2: '>=3.23.1'
  proxy-addr: '>=2.0.8'
  qs: '>=6.16.0'
  sharp: '>=0.35.5'
  source-map-js: '>=1.2.2'
